name: DS Estimate Tauri Windows
# Build is a packaged-backend smoke test, not certification of fully automatic quoting.
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/unified-compare-style-ui-20261105', 'codex/part-routing-automatic-fabrication-20261105']
    paths:
      - '.github/workflows/tauri-desktop-windows.yml'
      - 'desktop-tauri/src/**'
      - 'desktop-tauri/src-tauri/**'
      - 'desktop-tauri/cad_backend/**'
      - 'desktop-tauri/package.json'
      - 'desktop-tauri/tests/compiled_step_suite.py'
      - 'desktop-tauri/tests/cutting-plan.test.mjs'
      - 'desktop-tauri/tests/modular-compiled-gate.mjs'
concurrency:
  group: ds-estimate-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  workspace-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify unchanged frontend against successful UI run
        id: ui-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified=55561ff042c4d3c1a13c406c8e53b68367096f36
          git -C .. fetch --depth=1 origin "$verified"
          reuse=false
          if git -C .. diff --quiet "$verified" -- desktop-tauri/src desktop-tauri/package.json desktop-tauri/package-lock.json desktop-tauri/tests; then
            status="$(gh api repos/damianink-png/DS-Estimate/actions/runs/42166235094/jobs --jq '.jobs[] | select(.name == "workspace-ui") | .conclusion' || true)"
            if [[ "$status" == "success" ]]; then
              reuse=true
              echo "Verified identical UI and tests to successful run 42166235094 at $verified"
            fi
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
      - run: npm ci --no-audit --no-fund
        if: steps.ui-source.outputs.reuse != 'true'
      - run: npm test
        if: steps.ui-source.outputs.reuse != 'true'
      - name: Stock report fixture regression (no CAD dependencies)
        if: steps.ui-source.outputs.reuse != 'true'
        run: python tests/test_public_stock_audit.py
      - run: npm run build
        if: steps.ui-source.outputs.reuse != 'true'
      - run: python -m pip install playwright==1.64.1
        if: steps.ui-source.outputs.reuse != 'true'
      - run: python -m playwright install --with-deps chromium
        if: steps.ui-source.outputs.reuse != 'true'
      - name: File picker, drops, cached CAD snapshot and module status UI
        if: steps.ui-source.outputs.reuse != 'true'
        run: python tests/workspace_browser.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.ui-source.outputs.reuse != 'true'
        with:
          name: DS-Estimate-0.4-UI-evidence
          path: desktop-tauri/evidence/
  build-windows:
    needs: workspace-ui
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> target
      - name: Install frontend dependencies
        run: npm install
      - name: Test cost and geometry calculations
        run: npm test
      - name: Check STEP backend Python syntax
        run: python -m compileall -q cad_backend
      - name: Build Svelte
        run: npm run build
      - name: Install Miniforge for OCCT
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ds-cad
          python-version: '3.11'
          channels: conda-forge
          channel-priority: strict
      - name: Install CAD engine dependencies
        shell: pwsh
        run: |
          conda install -n ds-cad -c conda-forge -y pythonocc-core numpy pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'OCCT conda installation failed' }
      - name: Bundle offline CAD engine
        shell: pwsh
        run: |
          $catalogPath = (Resolve-Path 'src/lib/data/steel-sections.json').Path
          $catalogLicensePath = (Resolve-Path 'licenses/steel-section-database-MIT.txt').Path
          conda run -n ds-cad python -m PyInstaller --onefile --collect-all OCC --add-data "$catalogPath;data" --add-data "$catalogLicensePath;licenses" --name ds-cad-engine --distpath src-tauri/cad-backend --workpath build/cad-pyinstaller --specpath build/cad-spec cad_backend/step_inventory.py
          if ($LASTEXITCODE -ne 0) { throw 'CAD engine build failed' }
          if (!(Test-Path src-tauri/cad-backend/ds-cad-engine.exe)) { throw 'CAD engine missing' }
      - name: Smoke test bundled CAD engine
        shell: pwsh
        run: |
          & src-tauri/cad-backend/ds-cad-engine.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Bundled CAD engine failed to start' }
      - name: Compiled CAD engine real STEP geometry test
        shell: pwsh
        run: |
          @'
          import json, subprocess, tempfile
          from pathlib import Path
          from OCC.Core.BRepPrimAPI import BRepPrimAPI_MakeBox
          from OCC.Core.STEPControl import STEPControl_Writer, STEPControl_AsIs
          from OCC.Core.IFSelect import IFSelect_RetDone
          with tempfile.TemporaryDirectory() as td:
              step=Path(td)/'test_plate_100x50x10.step'
              writer=STEPControl_Writer()
              writer.Transfer(BRepPrimAPI_MakeBox(100.,50.,10.).Shape(), STEPControl_AsIs)
              assert writer.Write(str(step)) == IFSelect_RetDone
              exe=Path('src-tauri/cad-backend/ds-cad-engine.exe').resolve()
              result=subprocess.run([str(exe),str(step)],capture_output=True,text=True,timeout=120)
              assert result.returncode == 0, result.stderr
              data=json.loads(result.stdout)
              assert data['count']==1, data
              assert abs(data['totalMassKg']-0.3925)<0.0001, data
              snapshot=Path('build/modular-inventory.json')
              snapshot.parent.mkdir(parents=True, exist_ok=True)
              snapshot.write_text(json.dumps(data,ensure_ascii=False), encoding='utf-8')
              print(json.dumps({'case':'compiled-step-plate','status':'PASS','mass_kg':data['totalMassKg'],'volume_mm3':data['solids'][0]['volumeMm3'],'mode':'compiled OCCT exe'}))
          '@ | Set-Content -Path build_compiled_cad_test.py -Encoding utf8
          conda run -n ds-cad python build_compiled_cad_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Compiled CAD STEP benchmark failed' }
      - name: Compiled OCCT inventory to modular quote gate
        run: node tests/modular-compiled-gate.mjs build/modular-inventory.json
      - name: Eight compiled EXE STEP geometry regression cases
        shell: pwsh
        env:
          DS_CAD_DEBUG_CUTTING_HINT: '1'
        run: |
          conda run -n ds-cad python tests/compiled_step_suite.py
          if ($LASTEXITCODE -ne 0) { throw 'Compiled STEP regression suite failed' }
      - name: Catalogue, rotated geometry, rounded sections and compiled joint detection
        shell: pwsh
        run: |
          conda run -n ds-cad python tests/manufacturing_geometry_test.py --compiled
          if ($LASTEXITCODE -ne 0) { throw 'Manufacturing geometry tests failed' }
      - name: Automatic CAD-to-quote integration gate
        shell: pwsh
        run: |
          Write-Host 'NOT IMPLEMENTED: no verified automatic CAD geometry to costing pipeline in compiled Tauri app.'
          Write-Host 'This test is intentionally not marked as an automatic quotation PASS.'
      - name: Generate Windows icon
        shell: pwsh
        run: |
          python -m pip install pillow
          @'
          from PIL import Image, ImageDraw
          from pathlib import Path
          folder=Path('src-tauri/icons')
          folder.mkdir(parents=True,exist_ok=True)
          im=Image.new('RGBA',(256,256),'#121820')
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((24,24,232,232),radius=42,fill='#e9eef6')
          d.rectangle((74,78,181,96),fill='#121820')
          d.rectangle((74,119,181,137),fill='#121820')
          d.rectangle((74,160,181,178),fill='#121820')
          im.save(folder/'icon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -
      - name: Test native project file handling
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Tauri Windows installer
        run: npm run tauri -- build --verbose
      - name: Verify installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw 'NSIS installer not found' }
          $files | ForEach-Object { Write-Host $_.FullName }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DS-Estimate-0.4-Parts-Automation-Windows-Installer
          path: desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
