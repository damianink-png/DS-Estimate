name: DS Estimate Windows .NET 10 CI
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'engines/python/**'
      - 'DS_Estimate.sln'
      - '.github/workflows/windows-dotnet10.yml'
      - 'DS_Estimate_1.2_FIX81_LOCAL_DOTNET10_SDK_GATE_SOURCE-1.zip'
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract FIX81 source archive
        shell: pwsh
        run: |
          $archive = 'DS_Estimate_1.2_FIX81_LOCAL_DOTNET10_SDK_GATE_SOURCE-1.zip'
          if (!(Test-Path $archive)) { throw "Missing source archive: $archive" }
          Expand-Archive -LiteralPath $archive -DestinationPath extracted -Force
          $root = 'extracted/DS_Estimate_1.2_BUILD_READY'
          if (!(Test-Path "$root/DS_Estimate.sln")) { throw 'Solution missing from archive' }
          Get-ChildItem -LiteralPath $root -Force | Where-Object { $_.Name -ne '.github' } | Move-Item -Destination . -Force
      - name: Apply FIX82 forging classifier correction
        shell: pwsh
        run: |
          $file = 'src/DSEstimate.Core/ProjectIntelligenceEngines.cs'
          $source = [System.IO.File]::ReadAllText($file)
          $before = 'ODKUW|FORGING|GESCHMIEDET'
          $after = 'ODKUWKA|ODKUW|FORGING|GESCHMIEDET'
          if (!$source.Contains($before)) { throw 'FIX82: expected classifier pattern missing' }
          $source = $source.Replace($before, $after)
          [System.IO.File]::WriteAllText($file, $source)
      - name: Verify SDK
        shell: pwsh
        run: |
          dotnet --info
          if ((dotnet --version) -notmatch '^10\.') { throw 'Requires .NET 10 SDK' }
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore DS_Estimate.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build DS_Estimate.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: xUnit discovery
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          dotnet test tests/DSEstimate.Core.Tests/DSEstimate.Core.Tests.csproj -c Release --no-build --list-tests *> TestResults/xunit-discovery.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/verify_xunit_discovery.py TestResults/xunit-discovery.txt --min-discovered 60 --require-prefix DSEstimate.Core.Tests.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: xUnit real TRX
        shell: pwsh
        run: |
          python tests/clear_stale_trx.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/DSEstimate.Core.Tests/DSEstimate.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=ds-estimate-xunit.trx" --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/verify_dotnet_trx.py TestResults/ds-estimate-xunit.trx --require-results --min-executed 60 --reject-skipped
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ds-estimate-windows-test-evidence
          path: TestResults/
          if-no-files-found: warn
