name: DS Estimate public steel frames vs manual estimates
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-steel-fabrication.yml'
      - 'desktop-tauri/src/lib/cutting-audit.mjs'
      - 'desktop-tauri/src/lib/automatic-cutting.mjs'
      - 'desktop-tauri/src/lib/parts.mjs'
      - 'desktop-tauri/src/lib/cutting-plan.mjs'
      - 'desktop-tauri/src/lib/cutting-batch.mjs'
      - 'desktop-tauri/tests/cutting-audit.test.mjs'
      - 'desktop-tauri/tests/public_cutting_occurrence_audit.mjs'
      - 'desktop-tauri/cad_backend/**'
      - 'desktop-tauri/tests/test_stock_patterns.py'
      - 'desktop-tauri/tests/public_stock_axis_regression.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-steel-fabrication.yml'
      - 'desktop-tauri/tests/public_fabrication_projects.json'
      - 'desktop-tauri/tests/public_fabrication_benchmark.py'
      - 'desktop-tauri/tests/public_fabrication_compare.mjs'
      - 'desktop-tauri/tests/public_fabrication_geometry_audit.py'
      - 'desktop-tauri/src/lib/cutting-audit.mjs'
      - 'desktop-tauri/src/lib/automatic-cutting.mjs'
      - 'desktop-tauri/src/lib/parts.mjs'
      - 'desktop-tauri/tests/public_cutting_occurrence_audit.mjs'
      - 'desktop-tauri/src/lib/cutting-plan.mjs'
      - 'desktop-tauri/src/lib/geometry.mjs'
      - 'desktop-tauri/tests/geometry.test.mjs'
      - 'desktop-tauri/src/lib/cutting-batch.mjs'
      - 'desktop-tauri/src/lib/public-comparison-gate.mjs'
      - 'desktop-tauri/tests/public-comparison-gate.test.mjs'
      - 'desktop-tauri/tests/public_fabrication_regression.mjs'
      - 'desktop-tauri/tests/public_fabrication_regression.test.mjs'
      - 'desktop-tauri/src/QuickEstimate.svelte'
      - 'desktop-tauri/cad_backend/step_inventory.py'
      - 'desktop-tauri/cad_backend/section_catalog.py'
      - 'desktop-tauri/cad_backend/stock_recognition.py'
      - 'desktop-tauri/cad_backend/stock_patterns.py'
      - 'desktop-tauri/tests/public_stock_axis_regression.py'
      - 'desktop-tauri/src/lib/data/steel-sections.json'
      - 'desktop-tauri/licenses/steel-section-database-MIT.txt'
      - 'desktop-tauri/tests/manufacturing_geometry_test.py'
      - 'desktop-tauri/cad_backend/rigid_match.py'
      - 'desktop-tauri/cad_backend/shape_index.py'
      - 'desktop-tauri/tests/test_shape_index.py'
      - 'desktop-tauri/tests/test_inventory_source_integrity.py'
      - 'desktop-tauri/tests/test_inventory_progress.py'
      - 'desktop-tauri/tests/test_rigid_translation.py'
      - 'desktop-tauri/tests/test_dockhub_independent_merge.py'
      - 'desktop-tauri/tests/cutting-batch.test.mjs'
      - 'desktop-tauri/src/lib/quote-modules/**'
      - 'desktop-tauri/src/lib/modular-quote.mjs'
      - 'desktop-tauri/tests/modular-quote.test.mjs'
      - 'desktop-tauri/tests/modular-compiled-gate.mjs'
permissions:
  contents: read
concurrency:
  group: ds-public-steel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Existing quote and cutting regression tests
        run: npm test
      - name: Guard STEP inventory runtime budget declarations
        run: python tests/test_inventory_source_integrity.py
      - name: Guard partial profiling and failure timing
        run: python tests/test_inventory_progress.py
      - name: Regression tests for indexed STEP duplicate lookup
        run: python tests/test_shape_index.py
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ds-cad
          python-version: '3.11'
          channels: conda-forge
          channel-priority: strict
      - name: Install production CAD engine dependencies
        shell: pwsh
        run: |
          conda install -n ds-cad -c conda-forge -y pythonocc-core numpy pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'CAD engine dependency installation failed' }
      - name: Verify exact OCCT translation matching for symmetric solids
        shell: pwsh
        run: |
          conda run -n ds-cad python tests/test_rigid_translation.py
          if ($LASTEXITCODE -ne 0) { throw 'Symmetric B-Rep duplicate verification regression failed' }
      - name: Build the genuine DS Estimate CAD engine EXE
        shell: pwsh
        run: |
          $catalogPath = (Resolve-Path 'src/lib/data/steel-sections.json').Path
          $catalogLicensePath = (Resolve-Path 'licenses/steel-section-database-MIT.txt').Path
          conda run -n ds-cad python -m PyInstaller --onefile --collect-all OCC --add-data "$catalogPath;data" --add-data "$catalogLicensePath;licenses" --name ds-cad-engine --distpath src-tauri/cad-backend --workpath build/cad-pyinstaller --specpath build/cad-spec cad_backend/step_inventory.py
          if ($LASTEXITCODE -ne 0) { throw 'Engine compilation failed' }
          if (!(Test-Path src-tauri/cad-backend/ds-cad-engine.exe)) { throw 'Missing compiled DS Estimate CAD engine' }
      - name: Verify packaged catalogue and manufacturing geometry before public benchmarks
        shell: pwsh
        run: |
          conda run -n ds-cad python tests/manufacturing_geometry_test.py --compiled
          if ($LASTEXITCODE -ne 0) { throw 'Packaged catalogue or manufacturing geometry regression failed' }
      - name: Install PDF text extraction for the independently published drawings
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pymupdf
          if ($LASTEXITCODE -ne 0) { throw 'PyMuPDF unavailable' }
      - name: Benchmark three active public STEP assemblies against original PDFs and BOM
        shell: pwsh
        id: actual_projects
        run: |
          $env:DS_CAD_PROFILE = '1'
          python tests/public_fabrication_benchmark.py --engine src-tauri/cad-backend/ds-cad-engine.exe --out public_fabrication_output --timeout 240
          if ($LASTEXITCODE -ne 0) { throw 'Real public STEP benchmark gate failed: all three active genuine CAD models must import successfully' }
      - name: Confirm correct local tube axis on the unchanged Earthpress STEP
        shell: pwsh
        run: |
          python tests/public_stock_axis_regression.py public_fabrication_output
          if ($LASTEXITCODE -ne 0) { throw 'Earthpress oblique-section geometric-core regression' }
      - name: Run DS Estimate automatic cutting-time planner and compare independent manual time ranges
        if: always()
        shell: pwsh
        run: |
          if (Test-Path public_fabrication_output/public_cases.json) {
            node tests/public_fabrication_compare.mjs public_fabrication_output
            if ($LASTEXITCODE -ne 0) { throw 'DS Estimate public reference comparison failed' }
          } else {
            Write-Host 'No result JSON: previous setup failed. Check the logged reason.'
          }
      - name: Audit every public STEP body with production desktop cutting planner
        if: always()
        shell: pwsh
        run: |
          if (Test-Path public_fabrication_output/public_cases.json) {
            node tests/public_cutting_occurrence_audit.mjs public_fabrication_output
            if ($LASTEXITCODE -ne 0) { throw 'Per-occurrence cutting audit did not cover every imported STEP body' }
          } else {
            throw 'Missing public STEP inventory: per-occurrence audit cannot run'
          }
      - name: Independent StepGen mass and EarthPress grouped-occurrence Boolean audit
        shell: pwsh
        run: |
          conda run -n ds-cad python tests/public_fabrication_geometry_audit.py public_fabrication_output
          if ($LASTEXITCODE -ne 0) { throw 'Independent public geometry proof failed; baseline must not be accepted' }
      - name: Pinned source STEP mass, duplicate grouping and partial cutting regression gate
        if: always()
        shell: pwsh
        run: |
          if (Test-Path public_fabrication_output/comparison.json) {
            node tests/public_fabrication_regression.mjs public_fabrication_output/comparison.json
            if ($LASTEXITCODE -ne 0) { throw 'Pinned public CAD geometry or cutting regression: review artifacts and update baseline only with evidence' }
          } else {
            throw 'Missing comparison.json: cannot verify pinned geometry and cutting regression'
          }
      - name: Upload reproducible benchmark, source SHA256, independent/manual comparison and error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DS-Estimate-REAL-PUBLIC-FRAMES-STEP-PDF-BOM
          path: |
            desktop-tauri/public_fabrication_output/**
            desktop-tauri/tests/public_fabrication_projects.json
          if-no-files-found: warn
